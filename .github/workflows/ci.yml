name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Test runner, MCP, Skill, and installer
        run: npm test
      - name: Install control-plane dependencies
        working-directory: cloud
        run: npm ci
      - name: Test control plane
        working-directory: cloud
        run: npm test
      - name: Lint control plane
        working-directory: cloud
        run: npm run lint
